<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter";
    src: url("/fonts/Inter-Variable.ttf") format("truetype-variations");
    font-weight: 100 900; font-display: block;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; background:transparent; }
  body { display:flex; align-items:center; justify-content:center; font-family:"Inter", sans-serif; }
  .badge {
    width:1040px; height:1040px; border-radius:50%;
    background:var(--fill,#007df6); border:24px solid #000;
    box-shadow: inset 0 0 0 10px #c3f900;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  .cypn { color:#fff; font-weight:800; font-size:330px; letter-spacing:-0.02em; line-height:0.9; }
  .tagline { color:#fff; font-weight:800; font-size:40px; letter-spacing:0.24em; text-transform:uppercase; opacity:0.92; }
</style>
</head>
<body>
  <div class="badge">
    <div class="cypn">CYPN</div>
    <div class="tagline">Caribbean YPN</div>
  </div>
</body>
</html>
