<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter";
    src: url("/fonts/Inter-Variable.ttf") format("truetype-variations");
    font-weight: 100 900; font-display: block;
  }
  :root {
    --ink:#000; --paper:#fff; --signal-red:#ee3835; --cobalt:#007df6;
    --acid-lime:#c3f900; --spring-mint:#6dff80; --lavender:#bea2e7;
    --orchid:#e280fd; --lemon:#f8eb39; --kelly-green:#29b24a; --coral:#ffabab;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; }
  body { font-family:"Inter", sans-serif; background:var(--ink); padding:36px; overflow:hidden; }

  .poster {
    width:100%; height:100%;
    background:var(--cobalt); color:var(--paper);
    border:7px solid var(--ink); border-radius:72px;
    padding:70px 64px 60px;
    display:flex; flex-direction:column;
  }
  .logo { width:640px; max-width:100%; height:auto; }

  .kicker {
    align-self:flex-start; margin-top:56px;
    background:var(--acid-lime); color:var(--ink);
    border:5px solid var(--ink); border-radius:999px;
    font-weight:800; font-size:34px; letter-spacing:0.2em; text-transform:uppercase;
    padding:20px 40px;
  }

  .headline {
    font-weight:800; text-transform:uppercase; letter-spacing:-0.03em; line-height:0.92;
    font-size:132px; margin-top:40px;
  }
  .sub {
    font-weight:600; font-size:46px; line-height:1.2; margin-top:44px; max-width:24ch;
  }

  .photo {
    margin-top:auto;
    border:16px solid var(--lemon); border-radius:40px; overflow:hidden;
    height:520px; position:relative;
  }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .photo .tag {
    position:absolute; left:26px; bottom:26px;
    background:var(--signal-red); color:var(--paper);
    border:5px solid var(--ink); border-radius:999px;
    font-weight:800; font-size:30px; letter-spacing:0.14em; text-transform:uppercase;
    padding:16px 30px;
  }

  .footer {
    margin-top:46px; display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  .url { font-weight:800; font-size:48px; letter-spacing:-0.01em; }
  .handle {
    background:var(--paper); color:var(--ink);
    border:5px solid var(--ink); border-radius:999px;
    font-weight:800; font-size:34px; padding:16px 34px; white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="poster">
    <img class="logo" src="/logo-white.png" alt="Caribbean Young Parliamentarians Network" />
    <span class="kicker">What we do</span>
    <div class="headline">Young Voices,<br/>Real Seats</div>
    <p class="sub">We bring young members of parliament together across the Caribbean, so the generation that inherits every decision has a seat where they're made.</p>
    <div class="photo">
      <img src="/img/caribbean.jpg" alt="Caribbean shoreline" />
      <span class="tag">The under-35 caucus</span>
    </div>
    <div class="footer">
      <span class="url">caribbeanypn.org</span>
      <span class="handle">@caribbeanypn</span>
    </div>
  </div>
</body>
</html>
